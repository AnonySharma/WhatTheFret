  <!-- the "click": a fretted note with a ripple -->
  <circle cx="33" cy="34" r="11" fill="none" stroke="#35c4b4" stroke-opacity=".45" stroke-width="1.6"/>
  <circle cx="33" cy="34" r="7.5" fill="#1aa89b" fill-opacity=".3"/>
  <circle cx="33" cy="34" r="4.8" fill="#f5a524"/>
  <circle cx="19" cy="18" r="3" fill="#35c4b4"/>
