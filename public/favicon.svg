<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292524"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".6"/>
      <stop offset="1" stop-color="#f97316" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- strings -->
  <g stroke="#78716c" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 18H56M12 26H56M12 34H56M12 42H56M12 50H56"/>
  </g>
  <!-- frets -->
  <g stroke="#44403c" stroke-width="1.6" stroke-linecap="round">
    <path d="M26 14V54M40 14V54M54 14V54"/>
  </g>
  <!-- nut on the left -->
  <path d="M11 12V56" stroke="#e7e5e4" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the "click": a fretted note with a ripple -->
  <circle cx="33" cy="34" r="14" fill="url(#glow)"/>
  <circle cx="33" cy="34" r="11" fill="none" stroke="#fbbf24" stroke-opacity=".5" stroke-width="1.6"/>
  <circle cx="33" cy="34" r="4.9" fill="#f59e0b"/>
  <circle cx="33" cy="34" r="1.8" fill="#fef3c7"/>
  <!-- the other notes of the pattern -->
  <circle cx="19" cy="18" r="3" fill="#fbbf24"/>
  <circle cx="47" cy="50" r="3" fill="#f97316"/>
</svg>
