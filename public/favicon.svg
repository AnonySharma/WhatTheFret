<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c2e"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c4b4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- strings -->
  <g stroke="#5f6b8b" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 18H56M12 26H56M12 34H56M12 42H56M12 50H56"/>
